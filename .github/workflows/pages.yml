# Publie le dossier web/ (site statique) sur GitHub Pages à chaque push sur main.
# Prérequis : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des données
        run: test -s web/data/games.js
      - name: Retirer les fichiers de développement
        run: rm -f web/serve.py web/*.d.ts web/ARCHITECTURE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
